services:
  - type: web
    name: tds-ga2-q06
    runtime: python
    plan: free
    rootDir: GA2/Q06
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: REDIS_URL
        fromService:
          type: redis
          name: tds-ga2-q06-redis
          property: connectionString

  - type: redis
    name: tds-ga2-q06-redis
    plan: free
    ipAllowList: []
